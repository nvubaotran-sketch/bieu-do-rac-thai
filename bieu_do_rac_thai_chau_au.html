<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu đồ Rác thải Châu Âu (EU)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; max-width: 800px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #334155; color: #94a3b8; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #0284c7; color: white; }
        .chart-container { position: relative; height: 320px; width: 100%; }
        .info-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px 16px; border-radius: 0 8px 8px 0; margin-top: 20px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>THỐNG KÊ XỬ LÝ CHẤT THẢI CHÂU ÂU (EU)</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ran')">Rác thải Rắn</button>
            <button class="tab-btn" onclick="switchTab('long')">Chất thải Lỏng</button>
            <button class="tab-btn" onclick="switchTab('khi')">Chất thải Khí</button>
        </div>
        <div class="chart-container">
            <canvas id="wasteChart"></canvas>
        </div>
        <div class="info-box" id="infoText">
            <strong>Rác thải Rắn:</strong> Phát sinh 513 kg/người/năm (~2.2 tỷ tấn/năm toàn EU). Tỷ lệ xử lý đạt <strong>76%</strong> (49% tái chế + 27% biến thành năng lượng).
        </div>
    </div>

    <script>
        const dataMap = {
            ran: {
                labels: ['Tái chế / Ủ phân', 'Thiêu đốt thu năng lượng', 'Chôn lấp (Chưa xử lý tốt)'],
                data: [49, 27, 24],
                colors: ['#22c55e', '#3b82f6', '#ef4444'],
                text: '<strong>Rác thải Rắn:</strong> Phát sinh 513 kg/người/năm (~2.2 tỷ tấn/năm toàn EU). Tỷ lệ xử lý đạt <strong>76%</strong> (49% tái chế + 27% biến thành năng lượng).'
            },
            long: {
                labels: ['Xử lý sinh học / Bậc cao', 'Xử lý sơ cấp / Bậc hai', 'Chưa xử lý đạt chuẩn'],
                data: [70, 21, 9],
                colors: ['#06b6d4', '#3b82f6', '#f59e0b'],
                text: '<strong>Chất thải Lỏng (Nước thải):</strong> Phát sinh ~40 tỷ m³/năm. Đạt tỷ lệ xử lý đạt chuẩn kỷ lục <strong>91%</strong> trước khi xả ra môi trường.'
            },
            khi: {
                labels: ['Cắt giảm nhờ Năng lượng sạch', 'Cắt giảm nhờ Tiết kiệm / CBAM', 'Lượng phát thải còn lại'],
                data: [20, 12, 68],
                colors: ['#10b981', '#8b5cf6', '#64748b'],
                text: '<strong>Chất thải Khí (Khí nhà kính):</strong> Tổng ~3.4 tỷ tấn CO2e/năm. Đã cắt giảm/kiểm soát <strong>32%</strong> so với đỉnh phát thải, hướng tới Net-Zero 2050.'
            }
        };

        let myChart;
        const ctx = document.getElementById('wasteChart').getContext('2d');

        function initChart(category) {
            const config = dataMap[category];
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: config.labels,
                    datasets: [{
                        data: config.data,
                        backgroundColor: config.colors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#f8fafc', font: { size: 13 } } }
                    }
                }
            });
        }

        function switchTab(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const config = dataMap[category];
            myChart.data.labels = config.labels;
            myChart.data.datasets[0].data = config.data;
            myChart.data.datasets[0].backgroundColor = config.colors;
            myChart.update();

            document.getElementById('infoText').innerHTML = config.text;
        }

        initChart('ran');
    </script>
</body>
</html>
